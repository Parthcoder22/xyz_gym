<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer Glow Filter -->
  <defs>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef500" />
      <stop offset="100%" stop-color="#8bb700" />
    </linearGradient>
  </defs>

  <!-- Dark Kinetic Diamond/Hexagon Chassis -->
  <polygon points="60,6 112,32 112,88 60,114 8,88 8,32" fill="#0e0e0e" stroke="#2a2a2a" stroke-width="3" />
  
  <!-- Electric Lime Keyline Accent -->
  <polygon points="60,14 104,36 104,84 60,106 16,84 16,36" stroke="#bef500" stroke-width="2.5" stroke-opacity="0.8" />

  <!-- Bold Geometric "X" with Intersecting Kinetic Energy Blades -->
  <!-- Blade 1: Top-Left to Bottom-Right -->
  <path d="M34 32 L48 32 L86 88 L72 88 Z" fill="#ffffff" />
  
  <!-- Blade 2: Top-Right to Bottom-Left (Electric Lime Accent) -->
  <path d="M86 32 L72 32 L34 88 L48 88 Z" fill="url(#limeGrad)" filter="url(#neonGlow)" />
  
  <!-- Central High-Impact Cutout Bar / Core Core -->
  <polygon points="60,46 72,60 60,74 48,60" fill="#0e0e0e" />
  <circle cx="60" cy="60" r="4" fill="#bef500" />

  <!-- Top and Bottom Mini Neon Notches -->
  <rect x="56" y="10" width="8" height="4" fill="#bef500" rx="1" />
  <rect x="56" y="106" width="8" height="4" fill="#bef500" rx="1" />
</svg>
